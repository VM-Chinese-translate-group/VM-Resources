name: Deploy CDN Files

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'README.md'
      - 'name.json'
      - 'tips.txt'
      - 'resourcepack/**'
      - 'update/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-resources-oss-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - uses: aliyun/setup-aliyun-cli-action@v1
        with:
          version: '3.5.1'

      - name: Upload public files to OSS
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIYUN_AK_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_AK_SECRET }}
        run: |
          : "${ALIBABA_CLOUD_ACCESS_KEY_ID:?Missing ALIYUN_AK_ID}"
          : "${ALIBABA_CLOUD_ACCESS_KEY_SECRET:?Missing ALIYUN_AK_SECRET}"
          stage=$(mktemp -d)
          git archive HEAD -- README.md name.json tips.txt resourcepack update | tar -xf - -C "$stage"
          aliyun oss cp "$stage/" oss://vmct-resources/vm-resources/ --recursive \
            --region cn-beijing --sign-version v4 --disable-dir-object --disable-ignore-error \
            --meta 'Content-Disposition:attachment' --force

      - name: Purge ESA cache for VM-Resources
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIYUN_AK_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_AK_SECRET }}
        run: |
          aliyun esa PurgeCaches --region cn-hangzhou --SiteId 173850988714216 \
            --Type directory --Content '{"Directories":["https://files.vmct.top/vm-resources/"]}' --Force true
